<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicio de sesión del proyecto VESPER.">
  <title>Login — VESPER</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script defer src="assets/js/app.js"></script>
  <script defer src="assets/js/login.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="announcement">VESPER · PROYECTO DSY1104 · FRONTEND CON LOCAL STORAGE</div>
    <nav class="navbar container py-3" aria-label="Navegación de acceso">
      <a class="navbar-brand" href="login.html">VESPER<span>夜</span></a>
    </nav>
  </header>

  <main class="login-shell container">
    <section class="login-card" aria-labelledby="login-title">
      <p class="eyebrow">ACCESO</p>
      <h1 id="login-title" class="h2 mb-3">VESPER</h1>
      <p>Ingresa como administrador o usuario para acceder al catálogo.</p>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Correo</label>
          <input class="form-control" id="email" type="email" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-control" id="password" type="password" autocomplete="current-password" required>
        </div>
        <p id="login-error" class="text-danger" aria-live="polite"></p>
        <button class="btn btn-vesper w-100" type="submit">Ingresar</button>
      </form>

      <hr>
      <p class="small-note mb-1"><strong>Admin:</strong> admin@vesper.cl / admin123</p>
      <p class="small-note mb-0"><strong>Usuario:</strong> usuario@vesper.cl / user123</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <strong>VESPER夜</strong>
      <span>© <span data-year></span> · Proyecto académico DSY1104</span>
    </div>
  </footer>
</body>
</html>
