<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Carrito de compras simulado VESPER.">
  <title>Carrito — VESPER</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script defer src="assets/js/app.js"></script>
  <script defer src="assets/js/carrito.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="announcement">CARRITO · DEMOSTRACIÓN LOCAL</div>
    <nav class="navbar navbar-expand-lg container" aria-label="Navegación principal">
      <a class="navbar-brand" href="index.html">VESPER<span>夜</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-menu" aria-controls="main-menu" aria-expanded="false" aria-label="Abrir menú"><span class="navbar-toggler-icon"></span></button>
      <div id="main-menu" class="collapse navbar-collapse"><div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <a class="nav-link" href="index.html">Catálogo</a>
        <a id="nav-cart" class="nav-link active" href="carrito.html">Carrito <span id="cart-count" class="badge text-bg-danger">0</span></a>
        <a class="nav-link" href="contacto.html">Contacto</a>
        <span class="nav-link disabled"><span id="nav-user-name"></span> · <span id="nav-role" class="badge text-bg-secondary role-badge"></span></span>
        <button id="logout-btn" class="btn btn-sm btn-outline-light" type="button">Cerrar sesión</button>
      </div></div>
    </nav>
  </header>

  <main class="container">
    <header class="page-title"><p class="eyebrow">COMPRA</p><h1>Carrito</h1><p>Los productos se almacenan localmente en el navegador.</p></header>
    <div class="row g-4">
      <section class="col-lg-8" aria-labelledby="cart-products-title">
        <h2 id="cart-products-title" class="h4">Productos</h2>
        <div id="cart-empty" class="empty-state" hidden>Tu carrito está vacío. <a href="index.html">Volver al catálogo</a>.</div>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead><tr><th>Producto</th><th>Precio</th><th>Cantidad</th><th>Subtotal</th><th></th></tr></thead>
            <tbody id="cart-body"></tbody>
          </table>
        </div>
      </section>
      <aside class="col-lg-4">
        <div class="panel cart-summary">
          <h2 class="h4">Resumen</h2>
          <div class="d-flex justify-content-between fs-5 mb-3"><span>Total</span><strong id="cart-total">$0</strong></div>
          <button id="checkout-btn" class="btn btn-vesper w-100" type="button">Simular compra</button>
          <div id="checkout-message" class="alert alert-success mt-3 mb-0" role="status" hidden></div>
        </div>
      </aside>
    </div>
  </main>

  <footer class="site-footer"><div class="container footer-grid"><strong>VESPER夜</strong><span>© <span data-year></span> · Proyecto académico DSY1104</span></div></footer>
</body>
</html>
