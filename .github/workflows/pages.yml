name: Publicar Vesper en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configurar el origen de GitHub Pages
        uses: actions/github-script@v7
        with:
          script: |
            const repository = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: site } = await github.request('GET /repos/{owner}/{repo}/pages', repository);
            if (site.build_type !== 'workflow') {
              await github.request('PUT /repos/{owner}/{repo}/pages', {
                ...repository,
                build_type: 'workflow'
              });
            }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar la compilación
        id: deployment
        uses: actions/deploy-pages@v4
