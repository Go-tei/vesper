    <line x1="250" y1="76" x2="250" y2="130" stroke="#f72585" stroke-width="8" stroke-linecap="round"/>
    <line x1="276" y1="76" x2="276" y2="130" stroke="#f72585" stroke-width="8" stroke-linecap="round"/>

